<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;display=swap');
      .term-bg { fill: #07090F; stroke: #1A202C; stroke-width: 1; }
      .term-bar { fill: #11141D; }
      .text-prompt { font-family: 'Fira Code', monospace; font-size: 13px; fill: #00FF66; }
      .text-key { font-family: 'Fira Code', monospace; font-size: 13px; font-weight: 700; fill: #8892B0; letter-spacing: 1px; }
      .text-val { font-family: 'Fira Code', monospace; font-size: 13px; font-weight: 500; fill: #00F0FF; }
      .text-val-purple { font-family: 'Fira Code', monospace; font-size: 13px; font-weight: 500; fill: #9D00FF; }
      .glow-green { filter: drop-shadow(0 0 5px rgba(0, 255, 102, 0.4)); }
      .circle-red { fill: #FF5F56; }
      .circle-yellow { fill: #FFBD2E; }
      .circle-green { fill: #27C93F; }
    </style>
  </defs>

  <!-- Terminal Window -->
  <rect x="0" y="0" width="800" height="240" rx="6" class="term-bg" />
  
  <!-- Subtle Scanline -->
  <rect x="0" y="0" width="800" height="2" fill="#00F0FF" opacity="0.1">
    <animate attributeName="y" values="0;240;0" dur="4s" repeatCount="indefinite" />
  </rect>

  <path d="M 0 6 Q 0 0 6 0 L 794 0 Q 800 0 800 6 L 800 30 L 0 30 Z" class="term-bar" />
  
  <!-- Window Controls -->
  <circle cx="20" cy="15" r="5" class="circle-red" />
  <circle cx="35" cy="15" r="5" class="circle-yellow" />
  <circle cx="50" cy="15" r="5" class="circle-green" />
  <text x="70" y="19" font-family="'Fira Code', monospace" font-size="11" fill="#4B5563">prabu@ai-engineer:~</text>

  <!-- Content -->
  <text x="20" y="65" class="text-prompt glow-green">$&gt; ./system --status --verbose</text>
  
  <!-- Columns -->
  <g transform="translate(20, 100)">
    <text x="0" y="0" class="text-key">STATUS       :</text>
    <text x="140" y="0" class="text-prompt glow-green">[ONLINE] OPTIMAL</text>

    <text x="0" y="25" class="text-key">ROLE         :</text>
    <text x="140" y="25" class="text-val">AI ENGINEER</text>

    <text x="0" y="50" class="text-key">DOMAIN       :</text>
    <text x="140" y="50" class="text-val-purple">ARTIFICIAL INTELLIGENCE &amp; DATA SCIENCE</text>

    <text x="0" y="75" class="text-key">CORE         :</text>
    <text x="140" y="75" class="text-val">PYTHON</text>
  </g>
  
  <g transform="translate(420, 100)">
    <text x="0" y="0" class="text-key">ML / DL      :</text>
    <text x="140" y="0" class="text-val">ACTIVE (PyTorch, TF)</text>

    <text x="0" y="25" class="text-key">NLP / CV     :</text>
    <text x="140" y="25" class="text-val">ACTIVE (Transformers, OCR)</text>

    <text x="0" y="50" class="text-key">BACKEND      :</text>
    <text x="140" y="50" class="text-val">FASTAPI / UVICORN</text>

    <text x="0" y="75" class="text-key">INFRA        :</text>
    <text x="140" y="75" class="text-val">FASTCONNECT / DOCKER</text>
  </g>

  <!-- Cursor -->
  <text x="20" y="210" class="text-prompt glow-green">$&gt; <tspan fill="#00FF66" opacity="0.8">█</tspan></text>
  <animate attributeName="opacity" href="tspan" values="1;0;1" dur="1s" repeatCount="indefinite" />

  
  <!-- DYNAMIC_STATS_START -->
  <g transform="translate(620, 20)">
    <text x="0" y="0" font-family="'Fira Code', monospace" font-size="10" fill="#8892B0">LAST SYNC: 2026-09-18 06:42 UTC</text>
    <text x="0" y="15" font-family="'Fira Code', monospace" font-size="10" fill="#8892B0">REPOSITORIES: Unknown</text>
  </g>
  <!-- DYNAMIC_STATS_END -->
</svg>
