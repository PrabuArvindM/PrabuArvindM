<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 140" width="800" height="140">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&amp;display=swap');
      .box { fill: #07090F; stroke: #1A202C; stroke-width: 1.5; rx: 4; }
      .text-box { font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 600; fill: #00F0FF; letter-spacing: 1.5px; text-anchor: middle; }
      .arrow { stroke: #4B5563; stroke-width: 1.5; stroke-dasharray: 4 2; fill: none; }
      .arrow-active { stroke: #00F0FF; stroke-width: 1.5; stroke-dasharray: 4 2; fill: none; }
      .arrow-head { fill: #4B5563; }
      .arrow-head-active { fill: #00F0FF; }
      .glow-box { filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.3)); stroke: #00F0FF; stroke-width: 2; }
      .glow-box-purple { filter: drop-shadow(0 0 6px rgba(157, 0, 255, 0.4)); stroke: #9D00FF; stroke-width: 2; }
      .text-purple { fill: #9D00FF; }
      .text-white { fill: #FFFFFF; }
      .bg-grid { stroke: rgba(255, 255, 255, 0.02); stroke-width: 1; }
    </style>
    <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" class="arrow-head" />
    </marker>
    <marker id="arrowhead-active" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" class="arrow-head-active" />
    </marker>
    <pattern id="gridPatternPipeline" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" class="bg-grid" />
    </pattern>
  </defs>

  <rect width="800" height="140" fill="url(#gridPatternPipeline)" />

  <!-- Title -->
  <text x="400" y="25" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" fill="#8892B0" letter-spacing="3" text-anchor="middle">END-TO-END AI ENGINEERING PIPELINE</text>

  <g transform="translate(10, 60)">
    <!-- Nodes -->
    <rect x="0" y="0" width="85" height="45" class="box" />
    <text x="42.5" y="27" class="text-box">DATA</text>

    <rect x="110" y="0" width="100" height="45" class="box" />
    <text x="160" y="27" class="text-box">PREPROCESS</text>

    <rect x="235" y="0" width="85" height="45" class="box glow-box" />
    <text x="277.5" y="27" class="text-box text-white">MODEL</text>

    <rect x="345" y="0" width="85" height="45" class="box" />
    <text x="387.5" y="27" class="text-box">EVALUATE</text>

    <rect x="455" y="0" width="85" height="45" class="box glow-box-purple" />
    <text x="497.5" y="27" class="text-box text-purple">API</text>

    <rect x="565" y="0" width="100" height="45" class="box" />
    <text x="615" y="27" class="text-box">APPLICATION</text>

    <rect x="690" y="0" width="85" height="45" class="box glow-box" />
    <text x="732.5" y="27" class="text-box text-white">DEPLOY</text>

    <!-- Arrows -->
    <line x1="85" y1="22.5" x2="104" y2="22.5" class="arrow" marker-end="url(#arrowhead)" />
    <line x1="210" y1="22.5" x2="229" y2="22.5" class="arrow" marker-end="url(#arrowhead)" />
    <line x1="320" y1="22.5" x2="339" y2="22.5" class="arrow" marker-end="url(#arrowhead)" />
    <line x1="430" y1="22.5" x2="449" y2="22.5" class="arrow-active" marker-end="url(#arrowhead-active)">
       <animate attributeName="stroke-dashoffset" values="6;0" dur="1s" repeatCount="indefinite" />
    </line>
    <line x1="540" y1="22.5" x2="559" y2="22.5" class="arrow-active" marker-end="url(#arrowhead-active)">
       <animate attributeName="stroke-dashoffset" values="6;0" dur="1s" repeatCount="indefinite" />
    </line>
    <line x1="665" y1="22.5" x2="684" y2="22.5" class="arrow-active" marker-end="url(#arrowhead-active)">
       <animate attributeName="stroke-dashoffset" values="6;0" dur="1s" repeatCount="indefinite" />
    </line>
  </g>
</svg>
